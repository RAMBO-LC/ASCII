openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Learning dashboard operations
  - name: topics
    description: Topic-based mentor conversations
  - name: learning
    description: Roadmaps and learning resources
  - name: career
    description: Career-growth playbooks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /topics:
    get:
      operationId: listTopics
      tags: [topics]
      summary: List mentor topics
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
    post:
      operationId: createTopic
      tags: [topics]
      summary: Create a mentor topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicInput"
      responses:
        "201":
          description: Created topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
  /topics/{topicId}:
    delete:
      operationId: deleteTopic
      tags: [topics]
      summary: Delete a mentor topic
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "204":
          description: Topic deleted
  /topics/{topicId}/messages:
    get:
      operationId: listMessages
      tags: [topics]
      summary: List messages for a topic
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [topics]
      summary: Send a message to the AI mentor
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Persisted user message and mentor reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
  /roadmaps/{slug}:
    get:
      operationId: getRoadmap
      tags: [learning]
      summary: Get a structured learning roadmap
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
  /roadmaps:
    get:
      operationId: listRoadmaps
      tags: [learning]
      summary: List all roadmap paths
      responses:
        "200":
          description: Roadmap summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoadmapSummary"
  /roadmaps/{slug}/advice:
    post:
      operationId: requestRoadmapAdvice
      tags: [learning]
      summary: Get opt-in AI guidance for a roadmap
      description: Calls the AI mentor only when the learner explicitly asks, optionally scoped to one phase plus a follow-up question.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadmapAdviceInput"
      responses:
        "200":
          description: AI guidance in Markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapAdvice"
  /resources:
    get:
      operationId: listResources
      tags: [learning]
      summary: List curated learning resources
      parameters:
        - name: topic
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Learning resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
  /playbooks:
    get:
      operationId: listPlaybooks
      tags: [career]
      summary: List career-growth playbooks
      description: Step-by-step social and portfolio playbooks (LinkedIn, X, GitHub) tuned for beginners.
      responses:
        "200":
          description: Playbook list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playbook"
components:
  parameters:
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Dashboard:
      type: object
      required: [firstName, currentGoal, topicCount, resourceCount, recentActivity]
      properties:
        firstName:
          type: string
        currentGoal:
          type: string
        topicCount:
          type: integer
        resourceCount:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    Activity:
      type: object
      required: [id, label, detail, time]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        time:
          type: string
    Topic:
      type: object
      required: [id, title, techStack, messageCount, lastMessageAt, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        techStack:
          type: array
          items:
            type: string
        roadmapRef:
          type: ["string", "null"]
        messageCount:
          type: integer
        lastMessageAt:
          type: ["string", "null"]
        createdAt:
          type: string
    TopicInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          description: Optional. Omit to auto-generate from the first message.
        techStack:
          type: array
          items:
            type: string
    Message:
      type: object
      required: [id, topicId, role, content, createdAt]
      properties:
        id:
          type: string
        topicId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
    ChatResponse:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"
    Roadmap:
      type: object
      required: [slug, title, description, level, audience, outcomes, phases]
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        level:
          type: string
          description: e.g. Beginner-friendly
        audience:
          type: string
          description: Who this path is for
        outcomes:
          type: array
          items:
            type: string
          description: What the learner can do after finishing
        phases:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapPhase"
    RoadmapPhase:
      type: object
      required: [id, title, duration, topics, completed]
      properties:
        id:
          type: string
        title:
          type: string
        duration:
          type: string
        topics:
          type: array
          items:
            type: string
        completed:
          type: boolean
    RoadmapSummary:
      type: object
      required: [slug, title, description, level, audience, phaseCount, allTopics]
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        level:
          type: string
        audience:
          type: string
        phaseCount:
          type: integer
        allTopics:
          type: array
          items:
            type: string
          description: Flat list of every topic across phases, for search
    RoadmapAdviceInput:
      type: object
      properties:
        phaseId:
          type: string
          description: Scope guidance to one phase; omit for the whole roadmap
        question:
          type: string
          description: Optional follow-up question about this roadmap
    RoadmapAdvice:
      type: object
      required: [advice]
      properties:
        advice:
          type: string
          description: Markdown guidance from the AI mentor
        phaseId:
          type: ["string", "null"]
    Resource:
      type: object
      required: [id, title, description, type, duration, url, accent]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
        duration:
          type: string
        url:
          type: string
        accent:
          type: string
    PlaybookSection:
      type: object
      required: [id, title, body, points]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
          description: Markdown guidance for this section
        points:
          type: array
          items:
            type: string
    Playbook:
      type: object
      required: [slug, title, platform, tagline, description, audience, level, sections]
      properties:
        slug:
          type: string
        title:
          type: string
        platform:
          type: string
          description: e.g. LinkedIn, X, GitHub
        tagline:
          type: string
        description:
          type: string
        audience:
          type: string
        level:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/PlaybookSection"

